[project]
name = "expr05"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bjarte Johansen", email = "bjajoh@equinor.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.10.0",
    "lark>=1.3.1",
    "pandas>=2.3.2",
    "probabilit>=0.4.2",
    "scikit-learn>=1.7.1",
    "torch>=2.8.0",
    "transformers>=4.53.0",
    "xgrammar>=0.1.21",
]

[project.scripts]
expr05 = "expr05:main"
researcher = "expr05.researcher:main"
probabilitier = "expr05.probabiliter:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
